<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Clínica Salud - Registro Permanente</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}
body{background:#f4f8fc;color:#1f2937}
header{background:linear-gradient(90deg,#0b6fb8,#00a6d6);color:#fff;padding:25px}
.header{max-width:1300px;margin:auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.logo{font-size:32px;font-weight:800}
.tag{font-size:14px;opacity:.9}
.btn{border:none;padding:12px 20px;border-radius:10px;cursor:pointer;font-weight:700}
.btn-primary{background:#fff;color:#0b6fb8}
.btn-green{background:#18a857;color:#fff}
.btn-red{background:#e53e3e;color:#fff}
.container{max-width:1300px;margin:auto;padding:25px}
.card{background:#fff;padding:25px;border-radius:18px;box-shadow:0 10px 25px rgba(0,0,0,.06);margin-bottom:25px}
table{width:100%;border-collapse:collapse}
th{background:#eef4fb;padding:14px}
td{padding:14px;border-bottom:1px solid #e5e7eb;text-align:center}
tr:hover{background:#f8fbff}
input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);justify-content:center;align-items:center;z-index:999}
.box{background:#fff;padding:30px;border-radius:20px;width:100%;max-width:500px}
#reserva{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);overflow:auto;padding:30px}
.formbox{max-width:700px;margin:auto;background:#fff;padding:30px;border-radius:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
footer{text-align:center;padding:35px;color:#6b7280}
</style>
</head>
<body>

<header>
<div class="header">
<div>
<div class="logo">CLÍNICA SALUD</div>
<div class="tag">Ayacucho • Registro Permanente</div>
</div>

<div style="display:flex;gap:10px;flex-wrap:wrap;">
<button class="btn btn-green" onclick="verRegistros()">PERSONAS REGISTRADAS</button>
<button class="btn btn-primary" onclick="abrirLogin()">INGRESA USUARIO</button>
</div>
</div>
</header>

<div class="container">

<div class="card">
<h2 style="color:#0b6fb8;margin-bottom:20px;">Agenda de Consultorios</h2>
<table id="tabla"></table>
</div>

</div>

<footer>© 2026 Clínica Salud</footer>

<!-- LOGIN -->
<div class="modal" id="login">
<div class="box">
<h2 style="margin-bottom:20px;">Iniciar Sesión</h2>

<select id="rol">
<option>ADMINISTRADOR</option>
<option>MÉDICO</option>
<option>CAJERO</option>
</select>

<div style="margin-top:10px;"><input placeholder="Usuario"></div>
<div style="margin-top:10px;"><input type="password" placeholder="Contraseña"></div>

<div style="margin-top:20px;display:flex;gap:10px;">
<button class="btn btn-green" style="width:100%;" onclick="entrar()">ACCEDER</button>
<button class="btn btn-red" style="width:100%;" onclick="cerrarLogin()">VOLVER</button>
</div>
</div>
</div>

<!-- FORMULARIO -->
<div id="reserva">
<div class="formbox">

<h2 style="margin-bottom:20px;">Registro de Paciente</h2>

<div class="grid">
<div>
<label>Especialidad</label>
<input id="esp" readonly>
</div>

<div>
<label>Fecha</label>
<input id="fecha" type="date">
</div>

<div>
<label>Nombre</label>
<input id="nombre">
</div>

<div>
<label>DNI</label>
<input id="dni">
</div>
</div>

<div style="margin-top:15px;">
<label>Motivo</label>
<textarea id="motivo" rows="3"></textarea>
</div>

<div style="display:flex;gap:10px;margin-top:20px;">
<button class="btn btn-green" onclick="guardar()">CONFIRMAR</button>
<button class="btn btn-red" onclick="cerrarReserva()">CANCELAR</button>
</div>

</div>
</div>

<script>
let especialidades = [
{id:1,nombre:"MEDICINA GENERAL",max:15},
{id:2,nombre:"ODONTOLOGÍA",max:10},
{id:3,nombre:"PEDIATRÍA",max:12},
{id:4,nombre:"OBSTETRICIA",max:8},
{id:5,nombre:"CARDIOLOGÍA",max:6},
{id:6,nombre:"DERMATOLOGÍA",max:5}
];

/* PERMANENTE */
let citas = JSON.parse(localStorage.getItem("clinica_registros")) || [];
let actual = "";
let rolActual = "";

function guardarStorage(){
localStorage.setItem("clinica_registros", JSON.stringify(citas));
}

/* TABLA */
function cargarTabla(){

let html=`
<tr>
<th>ITEM</th>
<th>ESPECIALIDAD</th>
<th>CAPACIDAD</th>
<th>REGISTRADOS</th>
<th>LIBRES</th>
<th>ACCIONES</th>
</tr>
`;

especialidades.forEach(e=>{

let usados = citas.filter(x=>x.especialidad===e.nombre).length;
let libres = e.max - usados;

html+=`
<tr>
<td>${e.id}</td>
<td style="text-align:left;font-weight:bold;">${e.nombre}</td>
<td>${e.max}</td>
<td>${usados}</td>
<td>${libres}</td>
<td>
${libres>0
? `<button class="btn btn-green" onclick="abrirReserva('${e.nombre}')">SEPARAR CITA</button>`
: `<button class="btn btn-red">LLENO</button>`
}
</td>
</tr>
`;
});

document.getElementById("tabla").innerHTML=html;
}

/* RESERVA */
function abrirReserva(nombre){
actual = nombre;
document.getElementById("reserva").style.display="block";
document.getElementById("esp").value = nombre;
document.getElementById("fecha").valueAsDate = new Date();
}

function cerrarReserva(){
document.getElementById("reserva").style.display="none";
}

function guardar(){

let nombre = document.getElementById("nombre").value.trim();
let dni = document.getElementById("dni").value.trim();
let fecha = document.getElementById("fecha").value;
let motivo = document.getElementById("motivo").value.trim();

if(nombre=="" || dni==""){
alert("Complete datos");
return;
}

citas.push({
id:Date.now(),
nombre:nombre.toUpperCase(),
dni:dni,
especialidad:actual,
fecha:fecha,
motivo:motivo,
estado:"PENDIENTE"
});

guardarStorage();
cerrarReserva();
cargarTabla();

document.getElementById("nombre").value="";
document.getElementById("dni").value="";
document.getElementById("motivo").value="";

alert("Registro guardado y no se borrará al cerrar.");
}

/* LOGIN */
function abrirLogin(){
document.getElementById("login").style.display="flex";
}

function cerrarLogin(){
document.getElementById("login").style.display="none";
}

function entrar(){
rolActual = document.getElementById("rol").value;
cerrarLogin();
verRegistros();
}

/* VER REGISTROS */
function verRegistros(){

let win = window.open("","_blank");

let filas = "";

citas.forEach((c,i)=>{
filas += `
<tr>
<td>${i+1}</td>
<td>${c.nombre}</td>
<td>${c.dni}</td>
<td>${c.especialidad}</td>
<td>${c.fecha}</td>
<td>${c.estado}</td>
<td>
<button onclick="window.opener.eliminar(${c.id});window.location.reload()">BORRAR</button>
</td>
</tr>
`;
});

if(citas.length==0){
filas = `<tr><td colspan="7">No hay personas registradas</td></tr>`;
}

win.document.write(`
<html>
<head>
<title>Personas Registradas</title>
<style>
body{font-family:Segoe UI;padding:30px;background:#f3f7fb}
.box{background:#fff;padding:25px;border-radius:18px}
table{width:100%;border-collapse:collapse}
th{background:#0b6fb8;color:#fff;padding:12px}
td{padding:12px;border-bottom:1px solid #ddd;text-align:center}
button{padding:8px 10px}
</style>
</head>
<body>
<div class="box">
<h1>PERSONAS REGISTRADAS</h1>
<table>
<tr>
<th>N°</th>
<th>NOMBRE</th>
<th>DNI</th>
<th>ESPECIALIDAD</th>
<th>FECHA</th>
<th>ESTADO</th>
<th>ACCIONES</th>
</tr>
${filas}
</table>
<br>
<button onclick="window.close()">CERRAR</button>
</div>
</body>
</html>
`);
}

/* BORRAR */
function eliminar(id){
citas = citas.filter(x=>x.id!=id);
guardarStorage();
cargarTabla();
}

window.onload = cargarTabla;
</script>

</body>
</html>
